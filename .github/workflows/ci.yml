# Core CI: lint + typecheck + unit tests.
# Runs on pushes to main and on pull requests targeting main.
# Vercel is the authoritative production build / deployment check, so this
# workflow deliberately does NOT build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  release-notes:
    name: release notes (FA/EN)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check bilingual release notes
        # No dependencies needed: the script uses Node builtins only.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-release-notes.mjs
