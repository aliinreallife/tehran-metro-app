# Android TWA release: signed AAB + APK attached to a GitHub Release.
#
# Flow: merge PR -> main -> `git tag vX.Y.Z && git push origin vX.Y.Z`
#   -> validate semver -> verify tag is on main -> derive versions
#   -> signed Gradle build (android-release env) -> GitHub Release.
# No store auto-publishing: the signed APK is for direct distribution and
# Bazaar/Myket submission; the AAB is kept for future store needs.
#
# The `gate` job runs WITHOUT secrets and rejects bad tags before the
# environment-gated `build` job can load signing credentials.
#
# Third-party Actions are pinned to immutable commit SHAs (comments show the
# release version) — especially important here since this workflow signs
# production artifacts. Web workflows (ci.yml, e2e.yml) keep their own pins.
name: Android Release (TWA)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  gate:
    name: validate tag (no secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versionName: ${{ steps.versions.outputs.versionName }}
      versionCode: ${{ steps.versions.outputs.versionCode }}
    steps:
      - name: Checkout (full history for ancestry check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Strict semver validation + version derivation
        id: versions
        # Broad glob trigger above, strict gate here. Rejects v1, v1.0,
        # 1.0.0, v1.0.0-beta, v1.0.0foo — before secrets or builds.
        # versionCode = major*1_000_000 + minor*1_000 + patch
        # (minor,patch<=999; 1<=versionCode<=2_100_000_000 Play maximum).
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag: $TAG"
          OUT="$(node scripts/android-version.mjs "$TAG")"
          echo "$OUT"
          echo "versionName=$(echo "$OUT" | sed -n 's/^versionName=//p')" >> "$GITHUB_OUTPUT"
          echo "versionCode=$(echo "$OUT" | sed -n 's/^versionCode=//p')" >> "$GITHUB_OUTPUT"

      - name: Verify tag belongs to origin/main
        # A semver tag alone must not mint a signed production build.
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is contained in origin/main"
          else
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is NOT on origin/main. Releases only build from main."
            exit 1
          fi

      - name: Require matching CHANGELOG section
        # The GitHub Release body comes from CHANGELOG.md. Fail here — before
        # secrets or builds — instead of publishing generic/empty notes.
        run: |
          node scripts/extract-changelog-section.mjs "$GITHUB_REF_NAME" > /dev/null
          echo "CHANGELOG section for $GITHUB_REF_NAME: present"

  build:
    name: signed build + GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.gate.outputs.versionName }}
      VERSION_CODE: ${{ needs.gate.outputs.versionCode }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assert committed TWA config
        run: node scripts/check-android-config.mjs

      - name: Restore release keystore to runner temp
        # Keystore exists only in $RUNNER_TEMP for this job. Secrets are
        # never printed; the ephemeral runner discards the file afterwards.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty. Configure the android-release environment first (see docs/ANDROID_TWA.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/metto-release.jks"
          echo "keystore restored (${#ANDROID_KEYSTORE_BASE64} base64 chars -> $RUNNER_TEMP/metto-release.jks)"

      - name: Signing preflight (keystore + key recoverability)
        # Fails fast with a concise message when the restored keystore, alias,
        # or key password is wrong — before the slower Gradle build. Mirrors
        # the local keytool + jarsigner check (keytool -list alone cannot
        # validate the private-key password). Passwords travel via env only
        # (never echoed); just pass/fail is printed. Temp files are removed.
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/metto-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error::signing preflight: $1"; exit 1; }
          [ -s "${ANDROID_KEYSTORE_PATH:-}" ] || fail "keystore file missing or empty"
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || fail "ANDROID_KEY_ALIAS is empty"
          # 1. Alias must exist (also validates the keystore password).
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 \
            || fail "alias not found or keystore password rejected"
          # 2. Private key must be recoverable (validates the key password)
          #    by signing a throwaway JAR, exactly like the local check.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf 'preflight' > "$work/p.txt"
          (cd "$work" && jar cf preflight.jar p.txt)
          jarsigner -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            "$work/preflight.jar" "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 \
            || fail "private key is not recoverable (key password rejected)"
          jarsigner -verify "$work/preflight.jar" >/dev/null 2>&1 \
            || fail "preflight signature did not verify"
          rm -rf "$work"
          trap - EXIT
          echo "signing preflight: PASS (keystore present, alias exists, key recoverable)"

      - name: Signed bundle + APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/metto-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android bundleRelease assembleRelease --no-daemon --stacktrace \
            "-PmettoVersionCode=$VERSION_CODE" \
            "-PmettoVersionName=$VERSION_NAME"
          ls -l android/app/build/outputs/bundle/release/ android/app/build/outputs/apk/release/

      - name: Stage artifacts + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/metto-${GITHUB_REF_NAME}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/metto-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "metto-${GITHUB_REF_NAME}.aab" "metto-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Build release notes from CHANGELOG.md
        # User-facing bilingual notes first, artifact details appended after.
        # Extraction fails the job if the version section is missing.
        run: |
          set -euo pipefail
          node scripts/extract-changelog-section.mjs "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          {
            echo ""
            echo "---"
            echo ""
            echo "Metto Android $GITHUB_REF_NAME (versionCode $VERSION_CODE)."
            echo ""
            echo "Artifacts: signed .apk (release certificate) for direct testing and Bazaar/Myket submission + signed .aab for future store needs, with SHA256SUMS.txt."
            echo ""
            echo "No store auto-publishing is configured."
          } >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            "dist/metto-${GITHUB_REF_NAME}.aab" \
            "dist/metto-${GITHUB_REF_NAME}.apk" \
            dist/SHA256SUMS.txt
